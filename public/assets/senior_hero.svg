<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" fill="url(#bgGradient)" rx="24" />

  <!-- Ambient Aura Circles -->
  <circle cx="200" cy="220" r="180" fill="url(#glowGrad)" />
  <circle cx="640" cy="280" r="160" fill="url(#glowGrad)" />

  <!-- Stylized Senior using smartphone illustration -->
  <g transform="translate(180, 80)" filter="url(#softShadow)">
    <!-- Senior Figure (Left) -->
    <!-- Head with glasses -->
    <circle cx="160" cy="110" r="46" fill="#fde68a" />
    <!-- Hair -->
    <path d="M 116 100 C 116 65, 204 65, 204 100 C 204 80, 160 70, 116 100 Z" fill="#e2e8f0" />
    <!-- Glasses -->
    <circle cx="145" cy="110" r="14" fill="none" stroke="#0284c7" stroke-width="4" />
    <circle cx="175" cy="110" r="14" fill="none" stroke="#0284c7" stroke-width="4" />
    <path d="M 159 110 L 161 110" stroke="#0284c7" stroke-width="4" />
    <path d="M 131 108 L 122 104" stroke="#0284c7" stroke-width="4" />
    <path d="M 189 108 L 198 104" stroke="#0284c7" stroke-width="4" />
    <!-- Warm smile -->
    <path d="M 150 132 Q 160 142 170 132" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />

    <!-- Body / Clothes in cozy cardigan -->
    <path d="M 100 240 C 100 170, 220 170, 220 240 L 220 300 L 100 300 Z" fill="#0369a1" />
    <!-- Cardigan collar -->
    <path d="M 135 174 L 160 215 L 185 174" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

    <!-- Hands holding phone -->
    <!-- Smartphone with glowing accessible screen -->
    <rect x="220" y="140" width="80" height="140" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
    <rect x="226" y="148" width="68" height="110" rx="8" fill="#f8fafc" />
    <!-- Screen content preview: VIVA+ green and blue badges -->
    <circle cx="260" cy="175" r="16" fill="#10b981" />
    <path d="M 252 175 L 268 175 M 260 167 L 260 183" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <rect x="236" y="202" width="48" height="8" rx="4" fill="#0284c7" />
    <rect x="236" y="216" width="36" height="6" rx="3" fill="#94a3b8" />
    <rect x="236" y="228" width="42" height="18" rx="6" fill="#dc2626" />
    <text x="257" y="241" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">SOS</text>

    <!-- Hands holding the smartphone securely -->
    <path d="M 205 210 Q 220 205 228 220" stroke="#fde68a" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M 312 210 Q 298 205 292 220" stroke="#fde68a" stroke-width="12" stroke-linecap="round" fill="none" />
  </g>

  <!-- Accessibility Floating Badges on the right side -->
  <g transform="translate(530, 130)" filter="url(#softShadow)">
    <!-- Badge 1: Autonomia & Visão -->
    <rect x="0" y="0" width="220" height="60" rx="18" fill="rgba(255, 255, 255, 0.95)" />
    <circle cx="34" cy="30" r="18" fill="#e0f2fe" />
    <path d="M 24 30 C 28 24, 40 24, 44 30 C 40 36, 28 36, 24 30 Z" fill="none" stroke="#0284c7" stroke-width="3" />
    <circle cx="34" cy="30" r="4" fill="#0284c7" />
    <text x="64" y="26" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#0f172a">Alta Legibilidade</text>
    <text x="64" y="44" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">Letras grandes e áudio</text>

    <!-- Badge 2: SOS Real -->
    <rect x="0" y="74" width="220" height="60" rx="18" fill="rgba(255, 255, 255, 0.95)" />
    <circle cx="34" cy="104" r="18" fill="#fee2e2" />
    <path d="M 28 98 L 31 98 L 33 103 L 30 106 C 32 110, 36 114, 40 116 L 43 113 L 48 115 L 48 118 C 48 120, 26 120, 26 98 Z" fill="#dc2626" />
    <text x="64" y="100" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#0f172a">SOS em Pop-up</text>
    <text x="64" y="118" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">Socorro rápido na tela</text>

    <!-- Badge 3: Cuidado e Saúde -->
    <rect x="0" y="148" width="220" height="60" rx="18" fill="rgba(255, 255, 255, 0.95)" />
    <circle cx="34" cy="178" r="18" fill="#dcfce7" />
    <path d="M 34 168 C 26 160, 22 174, 34 186 C 46 174, 42 160, 34 168 Z" fill="#10b981" />
    <text x="64" y="174" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#0f172a">Saúde & Família</text>
    <text x="64" y="192" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#475569">Remédios e medições</text>
  </g>
</svg>
